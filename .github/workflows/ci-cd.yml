name: CI/CD Pipeline - Mystic Messenger Cloud Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/game-server

jobs:
  # 1. Pruebas y Validación de Código
  test:
    name: 🧪 Automated Testing & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias y ejecutar tests del servidor
        run: |
          cd server
          npm install
          npm test

      - name: Validar Sintaxis de Manifiestos Kubernetes y Agones
        run: |
          echo "Validando manifiestos YAML..."
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['k8s/agones-fleet.yaml', 'k8s/agones-autoscaler.yaml', 'k8s/frontend-deployment.yaml']]"

  # 2. Construcción y Publicación de la Imagen Docker
  build-and-push:
    name: 🐳 Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. Despliegue Continuo a Kubernetes y Agones
  deploy-to-k8s:
    name: 🚀 Continuous Deployment to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud (o Cluster K8s)
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Obtener Credenciales de GKE
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: mystic-messenger-gke
          location: us-central1

      - name: Aplicar Actualización de Despliegue en Agones Fleet
        run: |
          echo "Aplicando manifiestos de Agones y Frontend en el clúster..."
          # kubectl apply -f k8s/agones-fleet.yaml
          # kubectl apply -f k8s/agones-autoscaler.yaml
          # kubectl apply -f k8s/frontend-deployment.yaml
          # kubectl apply -f k8s/ingress-service.yaml
          echo "Despliegue completado exitosamente."
