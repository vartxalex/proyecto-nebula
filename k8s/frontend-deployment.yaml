apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystic-frontend-deployment
  namespace: default
  labels:
    app: mystic-messenger
    component: web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mystic-messenger
      component: web-frontend
  template:
    metadata:
      labels:
        app: mystic-messenger
        component: web-frontend
    spec:
      containers:
      - name: web-app
        image: gcr.io/mystic-messenger-cloud/game-server:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http-web
        env:
        - name: ENABLE_AGONES
          value: "false" # El frontend opera como servidor HTTP stateless
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
# Horizontal Pod Autoscaler (HPA) para Frontend Web
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mystic-frontend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mystic-frontend-deployment
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
